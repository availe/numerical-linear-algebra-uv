name: Notebook hygiene

on: [push, pull_request, merge_group]

permissions:
  contents: read

jobs:
  notebook-hygiene:
    name: Notebook hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --locked python scripts/notebook_clean.py check

name: Notebook environment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/check-notebooks.py
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/check-notebooks.py --execute --notebook "0.*" --notebook "1.*" --notebook "5.*" --notebook "8.*" --notebook "Homework*" --notebook "gradient-descent-intro.ipynb"

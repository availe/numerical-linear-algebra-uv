[project]
name = "numerical-linear-algebra-uv"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "imageio>=2.38.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas-summary>=0.2.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1,<6",
    "nbstripout>=0.9.1,<0.10",
    "scipy-stubs>=1.18.1.1",
]
